[project]
name = "triage-desk"
version = "2.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlmodel>=0.0.24,<0.1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "pwdlib[argon2]>=0.2,<1",
  "httpx>=0.28,<1",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.fastapi.static]
cdn = true
