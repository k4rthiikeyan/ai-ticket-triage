name: Prototype checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: prototype
          POSTGRES_PASSWORD: prototype-test-password
          POSTGRES_DB: prototype
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prototype"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://prototype:prototype-test-password@127.0.0.1:5432/prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m evaluation.run --output artifacts/rules-evaluation.json
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --audit-level=high
      - run: npm run build --prefix frontend
      - run: npm test --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
